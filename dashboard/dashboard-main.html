<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber - Tech Store</title>

    <!-- Bootstrap & FontAwesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="../components/style.css" />
    <link rel="stylesheet" href="../assests/css/homeStyle.css" />
    <link rel="stylesheet" href="../assests/css/productCard.css" />

    <!-- Auth & Navbar logic -->
    <script src="../assests/js/auth.js" defer></script>
    <script src="../assests/js/navbar.js" defer></script>
    <!-- load data to local storage on load -->
    <script defer src="../assests/js/dashboard-main.js" type="module"></script>
    <script src="../assests/js/initLocalStorage.js" type="module"></script>
    <link rel="stylesheet" href="../assests/css/cartBadge.css" />

    <!-- تحميل المكونات -->
    <script type="module">
      import { loadComponent } from "../assests/js/utils.js";
      // تحميل الـ header / footer / category / mainCategories
      loadComponent("header", "../components/header.html");
      loadComponent("footer", "../components/footer.html");
      loadComponent("category", "../components/category.html");
      loadComponent("mainCategories", "../components/mainCategories.html");
      loadComponent("panner", "../components/panner.html");

      setTimeout(() => {
        import("../assests/js/cartBadge.js");
      }, 1000);
    </script>

    <!-- Model Viewer -->
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>

    <link rel="stylesheet" href="../assests/css/dashboard-main.css" />
    <style></style>
  </head>
  <body>
    <!-- Header Navigation -->
    <header id="header"></header>
    <!--  -->

    <main class="container-fluid" id="main">
      <div class="row h-100">
        <nav class="col-lg-2 col-md-3 d-none d-md-block text-light sidebar">
          <div
            class="d-flex flex-column h-100 justify-content-between position-sticky pt-3"
          >
            <ul class="nav flex-column">
              <li
                class="nav-item mb-3 dashboard-SideMenuItem dashboard-SideMenuItemActive"
              >
                <a class="nav-link active" aria-current="page" href="#">
                  <i class="fa-solid fa-house text-dark"></i>
                  <span class="text-dark ms-2">Dashboard</span>
                </a>
              </li>
              <li class="nav-item mb-3 dashboard-SideMenuItem">
                <a class="nav-link" href="#">
                  <i class="fa-solid fa-boxes-stacked text-dark"></i>
                  <span class="text-dark ms-2">Products</span>
                </a>
              </li>
              <li class="nav-item mb-3 dashboard-SideMenuItem">
                <a class="nav-link" href="#">
                  <i class="fa-solid fa-receipt text-dark"></i>
                  <span class="text-dark ms-2">Orders</span>
                </a>
              </li>
              <li class="nav-item mb-3 dashboard-SideMenuItem">
                <a class="nav-link" href="#">
                  <i class="fa-solid fa-chart-line text-dark"></i>
                  <span class="text-dark ms-2">Analytics</span>
                </a>
              </li>
            </ul>

            <ul class="nav flex-column" id="logout-bottom-margin">
              <li class="nav-item">
                <a class="nav-link" href="#">
                  <i class="fa-solid fa-arrow-right-from-bracket text-dark"></i>
                  <span class="text-dark ms-2">Logout</span>
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <div class="col-lg-10 col-md-9 ms-sm-auto px-md-4">
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
          >
            <h1 class="h2">Seller Dashboard</h1>
          </div>
          <div
            class="d-flex flex-column flex-sm-row justify-content-center justify-content-sm-between flex-wrap flex-md-nowrap align-items-center py-2 my-4"
          >
            <h5 class="mb-3">Overview</h5>
            <!-- <select
              class="align-self-start d-block d-md-none"
              id="selectDashboardCategory"
            >
              <option
                class="nav-item col-6 col-lg-2 col-md-4"
                value="dashboard"
              >
                Dashboard
              </option>
              <option class="nav-item col-6 col-lg-2 col-md-4" value="products">
                Products
              </option>
              <option class="nav-item col-6 col-lg-2 col-md-4" value="orders">
                Orders
              </option>
              <option
                class="nav-item col-6 col-lg-2 col-md-4"
                value="analytics"
              >
                Analytics
              </option>
            </select> -->
            <div
              class="btn-group d-md-none"
              id="selectDashboardCategory"
              role="group"
              aria-label="Dashboard filter"
            >
              <input
                type="radio"
                class="btn-check"
                name="dashboard-filter"
                id="btnradio1"
                autocomplete="off"
                checked
              />
              <label class="btn btn-outline-dark btn-sm p-2" for="btnradio1"
                ><i class="fa-solid fa-house"></i> <span>Dashboard</span>
              </label>

              <input
                type="radio"
                class="btn-check"
                name="dashboard-filter"
                id="btnradio2"
                autocomplete="off"
              />
              <label class="btn btn-outline-dark btn-sm p-2" for="btnradio2"
                ><i class="fa-solid fa-boxes-stacked"></i>
                <span>Products</span></label
              >

              <input
                type="radio"
                class="btn-check"
                name="dashboard-filter"
                id="btnradio3"
                autocomplete="off"
              />
              <label class="btn btn-outline-dark btn-sm p-2" for="btnradio3"
                ><i class="fa-solid fa-receipt"></i> <span>Orders</span></label
              >

              <input
                type="radio"
                class="btn-check"
                name="dashboard-filter"
                id="btnradio4"
                autocomplete="off"
              />
              <label class="btn btn-outline-dark btn-sm p-2" for="btnradio4"
                ><i class="fa-solid fa-chart-line"></i>
                <span>Analytics</span></label
              >
            </div>
          </div>

          <div class="row">
            <div class="col-xl-3 col-md-6 mb-4">
              <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                  <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                      <div class="h6 text-xs fw-semibold text-uppercase mb-1">
                        Total Products
                      </div>
                      <div class="h4 mb-0 fw-bolder text-gray-800">20</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-xl-3 col-md-6 mb-4">
              <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                  <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                      <div class="h6 text-xs text-uppercase mb-1">
                        total revenue
                      </div>
                      <div class="h4 mb-0 fw-bolder text-gray-800">
                        $215,000
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-xl-3 col-md-6 mb-4">
              <div class="card border-left-info shadow h-100 py-2">
                <div class="card-body">
                  <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                      <div class="h6 text-xs text-uppercase mb-1">
                        total orders
                      </div>
                      <div class="h4 mb-0 fw-bolder text-gray-800">120</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-xl-3 col-md-6 mb-4">
              <div class="card border-left-warning shadow h-100 py-2">
                <div class="card-body">
                  <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                      <div class="h6 text-xs text-uppercase mb-1">
                        low stock products
                      </div>
                      <div class="h4 mb-0 fw-bolder text-gray-800">4</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!--  -->
    <footer id="footer"></footer>

    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script> -->
  </body>
</html>
