<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assests/css/bootstrap.min.css">
    <link rel="stylesheet" href="../components/style.css" />
    <link rel="stylesheet" href="./cart.css" />
    <link rel="stylesheet" href="../assests/css/cartBadge.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script type="module">
        import { loadComponent } from '../assests/js/utils.js';
        // Load header and footer components
        loadComponent('header', '../components/header.html');
        loadComponent('footer', '../components/footer.html');
    </script>
    <title>Shopping Cart - Cyber Tech Store</title>
    <style>
        .continue-shopping-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease-in-out;
            animation: pulse 2.5s infinite;
        }


        .continue-shopping-btn:hover {
            background: linear-gradient(135deg, #090c0f, #22303c);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .continue-shopping-btn {
            animation: pulse 2.5s infinite;
        }

        /* cart summry  */
        #cart-summary-section {
            position: sticky;
            top: 80px;
            /* adjust to your header height */
            align-self: flex-start;
            height: fit-content;
            /* ensure it doesn’t stretch too tall */
        }

        /* cart items fix layout */
        /* shared */
        .quantity-input {
            width: 52px;
            text-align: center;
        }

        .quantity-btn {
            width: 34px;
            height: 34px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .quantity-btn i {
            pointer-events: none;
        }

        /* MOBILE: neat 1-line grid for price | qty | total | remove */
        .cart-mobile {
            display: grid;
            grid-template-columns: auto auto 1fr auto;
            /* unit | qty | total grows | remove */
            align-items: center;
            column-gap: .75rem;
        }

        .cart-mobile .unit,
        .cart-mobile .total {
            white-space: nowrap;
        }

        .cart-mobile .total {
            justify-self: end;
        }

        /* push total to the right */
        .cart-mobile .qty {
            justify-self: center;
        }

        .cart-mobile .remove-btn {
            justify-self: end;
        }

        /* DESKTOP tweaks */
        @media (min-width: 768px) {
            .cart-item h5 {
                max-width: 100%;
            }

        }

        /* Optional visuals */
        .cart-item {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .04);
        }
    </style>
</head>

<body>
    <header id="header"></header>

    <main class="cart-container">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center mb-4">
                    <h2><i class="fas fa-shopping-cart me-2"></i>Your Shopping Cart</h2>
                    <p class="lead text-muted">Review your selected items below</p>
                </div>
            </div>

            <!-- Cart Items Section -->
            <div class="row  d-flex justify-content-center align-items-start flex-wrap">
                <div class="col-lg-8">
                    <div id="cart-items">
                        <!-- Cart items will be loaded here -->
                    </div>
                </div>

                <!-- Cart Summary Section -->
                <!-- Cart Summary Section -->
                <div class="col-lg-4" id="cart-summary-section" style="display:none;">
                    <div class="cart-summary">
                        <h4><i class="fas fa-receipt me-2"></i>Order Summary</h4>
                        <div id="cart-summary-content">
                            <!-- Summary will be loaded here -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script type="module">
        import { getCurrentUser, getCart, saveCart, removeFromCart } from '../assests/js/storage.js';

        class CartManager {
            constructor() {
                this.currentUser = getCurrentUser();
                this.cart = [];
                this.init();
            }

            init() {
                if (!this.currentUser) {
                    this.showEmptyCart('Please login to view your cart');
                    return;
                }

                this.loadCart();
                this.renderCart();
            }

            loadCart() {
                this.cart = getCart(this.currentUser.id) || [];
            }

            renderCart() {
                if (this.cart.length === 0) {
                    this.showEmptyCart();
                    return;
                }

                this.renderCartItems();
                this.renderCartSummary();

                // show summary section if cart has items
                document.getElementById('cart-summary-section').style.display = 'block';
            }

            renderCartItems() {
                const cartContainer = document.getElementById('cart-items');
                cartContainer.innerHTML = this.cart.map((item, index) => `
                    <div class="cart-item p-3">
                        <div class="row g-3 align-items-center">

                            <!-- Image -->
                            <div class="col-4 col-md-2">
                            <img src="${item.image}" alt="${item.name}" class="img-fluid rounded-3">
                            </div>

                            <!-- Title + category -->
                            <div class="col-8 col-md-4">
                            <h5 class="mb-1 text-truncate">${item.name}</h5>
                            <p class="text-muted mb-0 small">${item.category}</p>
                            </div>

                            <!-- MOBILE controls (single row: price | qty | total | remove) -->
                            <div class="col-12 d-md-none">
                            <div class="cart-mobile">
                                <div class="unit fw-bold">$${item.price}</div>

                                <div class="qty d-inline-flex align-items-center gap-2">
                                <button class="quantity-btn" onclick="cartManager.updateQuantity(${index}, -1)">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <input type="number" class="quantity-input" value="${item.quantity}"
                                        min="1" max="${item.stock}" onchange="cartManager.updateQuantityInput(${index}, this.value)">
                                <button class="quantity-btn" onclick="cartManager.updateQuantity(${index}, 1)">
                                    <i class="fas fa-plus"></i>
                                </button>
                                </div>

                                <div class="total fw-bold text-dark">$${(item.price * item.quantity)}</div>

                                <button class="remove-btn btn btn-sm btn-outline-danger"
                                        onclick="cartManager.removeItem(${index})" aria-label="Remove">
                                <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            </div>

                            <!-- DESKTOP columns -->
                            <div class="col-md-2 d-none d-md-block text-center fw-bold">$${item.price}</div>

                            <div class="col-md-2 d-none d-md-flex justify-content-center align-items-center">
                            <button class="quantity-btn" onclick="cartManager.updateQuantity(${index}, -1)">
                                <i class="fas fa-minus"></i>
                            </button>
                            <input type="number" class="quantity-input mx-2" value="${item.quantity}"
                                    min="1" max="${item.stock}" onchange="cartManager.updateQuantityInput(${index}, this.value)">
                            <button class="quantity-btn" onclick="cartManager.updateQuantity(${index}, 1)">
                                <i class="fas fa-plus"></i>
                            </button>
                            </div>

                            <div class="col-md-1 d-none d-md-block text-center fw-bold text-dark">
                            $${(item.price * item.quantity)}
                            </div>

                            <div class="col-md-1 d-none d-md-flex justify-content-end">
                            <button class="remove-btn btn btn-sm btn-outline-danger"
                                    onclick="cartManager.removeItem(${index})" aria-label="Remove">
                                <i class="fas fa-trash"></i>
                            </button>
                            </div>

                        </div>
                    </div>

                `).join('');
            }

            renderCartSummary() {
                const subtotal = this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const shipping = subtotal > 100 ? 0 : 10;
                const tax = subtotal * 0.14;
                const total = subtotal + shipping + tax;

                const summaryContainer = document.getElementById('cart-summary-content');
                summaryContainer.innerHTML = `
                    <div class="summary-item">
                        <span>Subtotal (${this.cart.length} items)</span>
                        <span>$${subtotal.toFixed(2)}</span>
                    </div>
                    <div class="summary-item">
                        <span>Shipping</span>
                        <span>${shipping === 0 ? 'Free' : '$' + shipping.toFixed(2)}</span>
                    </div>
                    <div class="summary-item">
                        <span>Tax</span>
                        <span>$${tax.toFixed(2)}</span>
                    </div>
                    <div class="summary-item summary-total">
                        <span>Total</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                    <button class="checkout-btn" onclick="cartManager.checkout()">
                        <i class="fas fa-credit-card me-2"></i>Proceed to Checkout
                    </button>
                `;
            }

            updateQuantity(index, change) {
                const item = this.cart[index];
                const newQuantity = item.quantity + change;

                if (newQuantity < 1) return;
                if (newQuantity > item.stock) return;

                item.quantity = newQuantity;
                this.saveCart();
                this.renderCart();
            }

            updateQuantityInput(index, value) {
                const item = this.cart[index];
                const newQuantity = parseInt(value);

                if (isNaN(newQuantity) || newQuantity < 1) {
                    item.quantity = 1;
                } else if (newQuantity > item.stock) {
                    item.quantity = item.stock;
                } else {
                    item.quantity = newQuantity;
                }

                this.saveCart();
                this.renderCart();
            }

            removeItem(index) {

                this.cart.splice(index, 1);
                this.saveCart();
                this.renderCart();

            }

            saveCart() {
                saveCart(this.currentUser.id, this.cart);
                // Update cart badge after saving
                this.updateCartBadge();
            }

            updateCartBadge() {
                const badge = document.getElementById('cart-badge');
                if (!badge) return;

                const totalItems = this.cart.reduce((sum, item) => sum + item.quantity, 0);

                if (totalItems > 0) {
                    badge.textContent = totalItems > 99 ? '99+' : totalItems;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }

            checkout() {
                if (this.cart.length === 0) {
                    alert('Your cart is empty!');
                    return;
                }

                // Save cart to localStorage for checkout page
                localStorage.setItem('checkoutCart', JSON.stringify(this.cart));
                window.location.href = '../CheckOutPage.html';
            }

            showEmptyCart(message = 'Your cart is empty') {
                const cartContainer = document.getElementById('cart-items');
                const summaryContainer = document.getElementById('cart-summary-content');
                const summarySection = document.getElementById('cart-summary-section');

                cartContainer.innerHTML = `
        <div class="empty-cart">
            <i class="fas fa-shopping-cart"></i>
            <h3>${message}</h3>
            <p>Looks like you haven't added any items to your cart yet.</p>
<a href="../index.html" class="continue-shopping-btn">

  <span>Continue Shopping</span>
</a>


        </div>
    `;

                summaryContainer.innerHTML = '';
                summarySection.style.display = 'none'; // hide the whole summary section
            }
        }

        // Initialize cart manager
        window.cartManager = new CartManager();
    </script>
    <script src="../assests/js/authGuard.js"></script>
</body>

</html>
